      # - "host.docker.internal:host-gateway"
    # networks:
      # - localhost-network
      
    # command: ./scripts/run-cypress.sh

networks:
  localhost-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
volumes:
  pg_data:

services:
  app:
    build:
      context: ./
      dockerfile: dev.Containerfile
    image: apparaatti_dev
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/postgres
      - PORT=8000
    volumes:
      - ./:/opt/app-root/src
    ports:
      - 3000:3000
      - 8000:8000
    container_name: apparaatti_dev
    networks:
      - localhost-network
 # # updater:
  #   build:
  #     context: ./
  #     dockerfile: dev.Containerfile
  #   image: apparaatti_dev
  #   environment:
  #     - DATABASE_URL=postgres://postgres:postgres@db:5432/postgres
  #     - PORT=4004
  #     - UPDATER_ENABLED=true
  #   volumes:
  #     - ./:/opt/app-root/src
  #   ports:
  #     - 4004:4004
  #   container_name: apparaatti_dev_updater


  # unit tests, runs once on `docker compose up` and exits
  # no network and no db on purpose, the unit tests must not touch the running app
  test:
    build:
      context: ./
      dockerfile: dev.Containerfile
    image: apparaatti_dev
    volumes:
      - ./:/opt/app-root/src
    container_name: apparaatti_test
    network_mode: none
    command: npm run test:run

  db:
    image: docker.io/postgres:15.8-alpine
    environment:
      - PGDATA=/data
      - POSTGRES_PASSWORD=postgres
    ports:
      - 5433:5432
    volumes:
      - pg_data:/data
    container_name: apparaatti_db
    networks:
        - localhost-network
    
  redis:
    image: redis:7-alpine
    container_name: apparaatti_redis
    networks:
        - localhost-network

  # cypress:
  #   build:
  #     context: ./

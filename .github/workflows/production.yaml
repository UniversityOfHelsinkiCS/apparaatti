name: Deploy to production

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: apparaatti
          tags: production ${{ github.sha }}
          containerfiles: |
            ./Containerfile
          build-args: |
            GIT_SHA=${{ github.sha }}
            IMAGE_SHA=${{ github.sha }}
            RELEASE_VERSION=${{ github.event.release.tag_name }}
            STAGING=false
      - name: Push to registry.version.helsinki.fi
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: registry.version.helsinki.fi/toska/openshift/kontit/
          username: kontit
          password: ${{ secrets.VERSION_PUSH_SECRET }}

  sentry-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install safe-chain
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci

      - name: Verify safe-chain
        run: npm safe-chain-verify --delay 7d

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build frontend with sourcemaps
        run: npm run build
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}

      - name: Create frontend Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: apparaatti-frontend
        with:
          environment: production
          version: ${{ github.event.release.tag_name }}
          set_commits: 'skip'
          sourcemaps: ./dist/assets
          url_prefix: '~/assets'

      - name: Create backend Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: apparaatti-backend
        with:
          environment: production
          version: ${{ github.event.release.tag_name }}
          set_commits: 'skip'
